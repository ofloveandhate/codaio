[tool.poetry]
name = "codaio"
version = "0.8.0"
description = "Python wrapper for Coda.io API"
authors = ["MB <mb@blaster.ai>", "silviana amethyst started modifying in fall 2025 <amethyst@mpi-cbg.de>"]
license = "MIT"
readme='README.md'
homepage='https://github.com/ofloveandhate/codaio'
# documentation='https://codaio.readthedocs.io/en/latest/index.html'
# (left out rather than empty: poetry-core rejects a non-URI documentation key)

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31.0"
attrs = "^23.1.0"
python-dateutil = "^2.8.2"
inflection = "^0.5.1"
decorator = "^5.1.1"
# Required, not an extra: storing the API token encrypted at rest is the
# recommended way to use this library, so it has to work from a plain
# `pip install codaio`. On Linux this pulls SecretStorage and cryptography.
keyring = "^25.0"
# Genuinely optional, and both need a deliberate opt-in anyway: python-dotenv
# only matters if you set CODAIO_DOTENV, and httpx only if you set USE_HTTPX
# (which coda.py has always soft-imported but never declared).
python-dotenv = {version = "^1.0", optional = true}
httpx = {version = "^0.27", optional = true}

[tool.poetry.extras]
dotenv = ["python-dotenv"]
httpx = ["httpx"]

# `dev-dependencies` is the deprecated spelling; this is the group form.
[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
# was `pytest-coverage = "^0.0"`, which is a dummy package on PyPI, not the
# plugin -- so `pytest --cov` could never have worked
pytest-cov = "^7.0"
coverage = {version = "^7.6", extras = ["toml"]}
responses = ">=0.25"
# CI installs flake8 ad hoc; declaring it keeps the two in step
flake8 = "^7.1"
black = "^26.0"
# 8.1 is the newest sphinx that still supports 3.10; 8.2+ needs 3.11
sphinx = "^8.0"
sphinx-rtd-theme = "^3.0"

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["codaio"]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

